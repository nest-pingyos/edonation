# eDonation - Development Override
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Features:
# - Hot reload with volume mounts
# - Debug mode enabled
# - phpMyAdmin enabled by default

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
    volumes:
      - .:/var/www/html
      # Custom PHP config for development
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/custom.ini:ro

  db:
    ports:
      - "3307:3306"

  phpmyadmin:
    profiles: [] # Enable by default in dev
