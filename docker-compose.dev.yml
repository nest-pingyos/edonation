# docker-compose.dev.yml — LOCAL DEVELOPMENT
# Usage: docker compose -f docker-compose.dev.yml up -d
#
# Code is mounted as a volume so changes reflect immediately without rebuild.
# phpMyAdmin is included at http://localhost:8081

version: '3.8'

services:
  db:
    image: mariadb:10.4
    container_name: edonation_db_dev
    environment:
      MYSQL_DATABASE: donation
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - edonation_db_dev:/var/lib/mysql
      - ./database/donation.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: edonation_app_dev
    ports:
      - "4200:80"
    volumes:
      - .:/var/www/html/edonation           # live code — no rebuild needed
      - ./docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: db
      DB_NAME: donation
      DB_USER: root
      DB_PASS: root
      APP_DOMAIN: http://localhost:4200
      API_DOMAIN: http://localhost:4200
      BASE_PATH: /edonation
      API_BASE_PATH: /edonation/api
      JWT_SECRET: dev_secret_key_change_in_production
    depends_on:
      db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: edonation_pma_dev
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "4200:80"
    depends_on:
      - db

networks:
  default:
    name: edonation_dev_network

volumes:
  edonation_db_dev:
