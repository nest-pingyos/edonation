<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # ตั้งค่า Alias เพื่อให้เข้าผ่าน /edonation เหมือนใน XAMPP
    Alias /edonation /var/www/html/edonation

    <Directory /var/www/html/edonation>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ส่วนของ API
    <Directory /var/www/html/edonation/api>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ส่วนของ Admin
    <Directory /var/www/html/edonation/admin>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
