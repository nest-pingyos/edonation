# eDonation - Production Override
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Features:
# - No source code mounting
# - Production optimizations
# - No phpMyAdmin

services:
  app:
    volumes:
      # Only persist uploads, don't mount source
      - receipts_data:/var/www/html/receipts/uploads
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  db:
    ports: [] # Don't expose in production
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  phpmyadmin:
    profiles:
      - never # Disable in production
