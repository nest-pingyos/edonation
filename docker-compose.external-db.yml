# =============================================================================
# eDonation - Docker Compose (External Database)
# =============================================================================
# ใช้สำหรับเชื่อมต่อไปยัง Database ภายนอกที่ app.nurse.cmu.ac.th
#
# Usage:
#   docker compose -f docker-compose.external-db.yml up -d
# =============================================================================

services:
  # ===========================================================================
  # PHP/Apache Application Container
  # ===========================================================================
  app:
    # Force AMD64 platform สำหรับ Windows
    platform: linux/amd64
    
    image: edonation:latest
    container_name: edonation-app
    
    # ถ้าต้องการ build ใหม่ uncomment ส่วนนี้:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    
    restart: unless-stopped
    
    ports:
      - "80:80"
    
    # ============================================================
    # Environment Variables - เชื่อมต่อ Database ภายนอก
    # ============================================================
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      
      # ========== EXTERNAL DATABASE CONNECTION ==========
      # เปลี่ยน hostname เป็นเซิร์ฟเวอร์ภายนอก
      - DB_HOST=app.nurse.cmu.ac.th
      - DB_PORT=3306
      - DB_NAME=donation
      - DB_USER=edonation
      - DB_PASS=edonate@FON
      # ===================================================
      
      - APP_DOMAIN=http://localhost
      - API_DOMAIN=http://localhost
      - BASE_PATH=
      - API_BASE_PATH=/api
      - JWT_SECRET=${JWT_SECRET:-your-production-secret-key}
      - JWT_EXPIRE=86400
      - LINE_TOKEN=${LINE_TOKEN:-}
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_PASS=${GMAIL_PASS:-}
      - TZ=Asia/Bangkok
    
    # ไม่มี depends_on เพราะใช้ Database ภายนอก
    
    networks:
      - edonation-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# =============================================================================
# Networks
# =============================================================================
networks:
  edonation-network:
    driver: bridge
