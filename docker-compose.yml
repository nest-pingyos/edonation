# eDonation - Docker Compose
#
# Usage:
#   Development: docker compose up -d
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Access: http://localhost:8080

services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edonation-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Mount source code for development
      - .:/var/www/html
      # Persist receipts
      - receipts_data:/var/www/html/receipts/uploads
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_DOMAIN=http://localhost:8080
      - API_DOMAIN=http://localhost:8080
      - BASE_PATH=
      - API_BASE_PATH=/api
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-edonation}
      - DB_USER=${DB_USER:-edonation}
      - DB_PASS=${DB_PASS:-edonation_secret}
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-key}
      - JWT_EXPIRE=${JWT_EXPIRE:-86400}
      - LINE_TOKEN=${LINE_TOKEN:-}
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_PASS=${GMAIL_PASS:-}
      - SCB_BILLER_ID=${SCB_BILLER_ID:-}
      - SCB_API_KEY=${SCB_API_KEY:-}
      - SCB_API_SECRET=${SCB_API_SECRET:-}
      - CMU_OAUTH_CLIENT_ID=${CMU_OAUTH_CLIENT_ID:-}
      - CMU_OAUTH_CLIENT_SECRET=${CMU_OAUTH_CLIENT_SECRET:-}
      - CMU_OAUTH_TENANT_ID=${CMU_OAUTH_TENANT_ID:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edonation-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: edonation-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_secret}
      - MYSQL_DATABASE=${DB_NAME:-edonation}
      - MYSQL_USER=${DB_USER:-edonation}
      - MYSQL_PASSWORD=${DB_PASS:-edonation_secret}
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    networks:
      - edonation-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secret}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # phpMyAdmin (optional, for database management)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: edonation-pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - UPLOAD_LIMIT=50M
    depends_on:
      - db
    networks:
      - edonation-network
    profiles:
      - tools

# Networks
networks:
  edonation-network:
    driver: bridge

# Volumes
volumes:
  db_data:
    driver: local
  receipts_data:
    driver: local
