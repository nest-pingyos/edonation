version: '3.8'

services:
  # ฐานข้อมูล (MariaDB 10.4)
  db:
    image: mariadb:10.4
    container_name: edonation_db
    restart: always
    environment:
      MYSQL_DATABASE: donation
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - edonation_db_data:/var/lib/mysql
      - ./database/donation.sql:/docker-entrypoint-initdb.d/init.sql

  # ส่วน Web Server (PHP + Apache)
  # ครอบคลุมทั้งส่วนหน้าเว็บ (root), admin, และ api
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: edonation_app
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html/edonation
      - ./docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf
    environment:
      - DB_HOST=db
      - DB_NAME=donation
      - DB_USER=root
      - DB_PASS=root
      - APP_DOMAIN=http://localhost:8080
      - API_DOMAIN=http://localhost:8080
      - APP_ENV=local
    depends_on:
      - db

networks:
  default:
    name: edonation_network

volumes:
  edonation_db_data:
